name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  daemon:
    name: Daemon (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # 24.04: the newest Ubuntu that still has Python 3.9
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # Crash, restart and concurrency scenarios run here too (test_scenarios.py, test_records.py).
      # A test that hangs prints every thread's stack and fails here, rather than running into the job's timeout and
      # losing its log: the watchdog starts again with each test, so it fires after one test runs for two minutes.
      - shell: bash  # also on Windows (Git Bash), where setup-python provides python but not always python3
        run: |
          python -u -c "
          import faulthandler, unittest
          class Watched(unittest.TextTestResult):
              def startTest(self, test):
                  faulthandler.dump_traceback_later(120, exit=True)
                  super().startTest(test)
          runner = unittest.TextTestRunner(verbosity=2, resultclass=Watched)
          unittest.main(module=None, testRunner=runner, argv=['unittest', 'discover', '-s', 'plugin/daemon'])
          "

  hooks:
    name: Hooks module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin test plugin
